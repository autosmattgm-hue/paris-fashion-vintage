<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20260518-mobile-picture-layouts-v2">
  <title>Admin Login | Fashion Vintage Paris</title>
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true"></div>
  <main class="login-card" aria-labelledby="loginTitle">
    <div class="login-logo">
      <span class="logo-mark">FVP</span>
      <div>
        <strong>Fashion Vintage Paris</strong>
        <span>Private administration</span>
      </div>
    </div>
    <h1 id="loginTitle">Secure Admin Access</h1>
    <p style="margin-block:0.5rem 1.4rem;">Manage products, bookings, customers, analytics, and boutique settings.</p>
    <form class="admin-form" data-admin-login>
      <div class="login-error" role="alert"></div>
      <div class="admin-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="admin-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="admin-btn primary" type="submit">Access Dashboard</button>
    </form>
  </main>
  <script src="../assets/js/admin.js?v=20260518-mobile-picture-layouts-v2" defer></script>
</body>
</html>
